[package]
name = "hlquery-rust-client"
version = "1.0.0"
edition = "2021"
authors = ["Carlos F. Ferry <carlos.ferry@gmail.com>"]
description = "Rust client library for hlquery search engine"
license = "BSD-3-Clause"
repository = "https://github.com/cferry/hlquery"

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
thiserror = "1.0"
md5 = "0.7"
urlencoding = "2.1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[[example]]
name = "example"
path = "example.rs"

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "collections"
path = "examples/collections.rs"

[[example]]
name = "documents"
path = "examples/documents.rs"

[[example]]
name = "search"
path = "examples/search.rs"

[[example]]
name = "sql"
path = "examples/sql.rs"
